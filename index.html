<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
  "https://xjwahoxrqxbgspusuurw.supabase.co";
const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqd2Fob3hycXhiZ3Nwc3V1cnU3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDE2MjksImV4cCI6MjEwMDk3NzYyOX0.DzZuGLx_4BXK0-ENA55WVKZM9C1iQiiGv--e-92mQZc";
const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
async function loadTips() {
  const container = document.getElementById("supabaseTips");
  const { data, error } = await supabaseClient
    .from("tips")
    .select('"Match name", "Created at", "Odds", "Match time", "Premium"')
    .eq("Premium", false)
    .order("Created at", { ascending: false });
  if (error) {
    console.error("Supabase hiba:", error);
    container.innerHTML =
      "<p style='color:#ff6b6b;text-align:center;'>" +
      "Supabase hiba: " +
      error.message +
      "</p>";
    return;
  }
  if (!data || data.length === 0) {
    container.innerHTML =
      "<p style='color:#bbb3ca;text-align:center;'>" +
      "Jelenleg nincs ingyenes tipp." +
      "</p>";
    return;
  }
  container.innerHTML = data.map(tip => `
    <div class="tip">
      <span class="tag">⚡ INGYENES</span>
      <h3>
        ${tip["Match name"] || "Meccs"}
      </h3>
      <div class="row">
        <span>Időpont</span>
        <strong>
          ${tip["Match time"] || "-"}
        </strong>
      </div>
      <div class="row">
        <span>Odds</span>
        <strong class="odds">
          ${tip["Odds"] || "-"}
        </strong>
      </div>
    </div>
  `).join("");
}
loadTips();
</script>
