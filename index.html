<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goaltipp – Futball tippek</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    header {
      background: #16a34a;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      font-size: 36px;
    }
    nav {
      margin-top: 12px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }
    .hero {
      text-align: center;
      padding: 70px 20px;
      background: #111827;
    }
    .hero h2 {
      font-size: 42px;
      margin-bottom: 15px;
    }
    .hero p {
      color: #cbd5e1;
      font-size: 18px;
      margin-bottom: 25px;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 45px 20px;
    }
    .container > h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .tips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .tip {
      background: #1e293b;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      border: 1px solid #334155;
    }
    .tip h3 {
      color: #4ade80;
      margin-bottom: 12px;
    }
    .tip p {
      margin: 8px 0;
      color: #cbd5e1;
    }
    .plans {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .plan {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      transition: transform 0.2s;
    }
    .plan:hover {
      transform: translateY(-5px);
    }
    .plan.featured {
      border-color: #eab308;
      background: linear-gradient(145deg, #172554, #1e293b);
    }
    .plan h3 {
      color: #facc15;
      font-size: 24px;
      margin-bottom: 15px;
    }
    .price {
      font-size: 32px;
      font-weight: bold;
      margin: 15px 0;
    }
    .period {
      color: #94a3b8;
      font-size: 14px;
    }
    .plan ul {
      list-style: none;
      margin: 20px 0;
      line-height: 2;
      color: #cbd5e1;
    }
    .button {
      display: inline-block;
      padding: 13px 20px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
    }
    .button:hover {
      background: #15803d;
    }
    .premium-button {
      background: #eab308;
      color: #111827;
    }
